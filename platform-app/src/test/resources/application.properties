# WebMvc / slice tests use HTTP Basic via MockMvc; enable regardless of main default (false).
# 切片测试用 MockMvc 的 HTTP Basic；不受主配置默认关闭影响。
platform.auth.http-basic-enabled=true
# Default lockout for slice tests (override in focused lockout tests).
# 切片测试默认锁定阈值；专项测试可覆盖。
platform.auth.lockout-max-failures=5
platform.auth.lockout-duration=PT15M
