# AI capability catalog — AI 能力目录
# Preview stubs only until AI-3b+ wires ModelCompletionClient. Never write stores without AiWriteConfirmGate.
# 预览桩；AI-3b+ 经 ModelCompletionClient。无 AiWriteConfirmGate 不得写库。见 docs/ai/capability-real-ai-plan.md
capabilities:
  - id: ai.summarizePreview
    titleEn: Summarize preview
    titleZh: 摘要预览
    summaryEn: Returns a fixed template preview string; does not write. Confirm before critical writes when gateway is wired.
    summaryZh: 返回固定模板预览字符串，不写库。接入网关后关键写回须确认。
  - id: ai.suggestTitlePreview
    titleEn: Suggest title preview
    titleZh: 标题建议预览
    summaryEn: Returns a fixed template title suggestion from the first line or ~60 chars; does not write.
    summaryZh: 按首行或约 60 字返回固定模板标题建议，不写库。
