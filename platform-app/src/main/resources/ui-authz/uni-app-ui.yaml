# uni-app end-user shell UI permission Manifest (ADR 0010 / PC-5)
# Thin shell bindings — not a console clone. Labels live in the uni-app client.
# Buttons require permission/anyOf (schema); page.read gates placeholder actions.
# 终端壳 UI 权限 Manifest：薄壳绑定，不克隆控制台；按钮须带权限；占位动作用 page.read。
version: 1
client: uni-app
defaults:
  lockedMenuEffect: grey
  missingButtonEffect: disable
entries:
  # Login-authenticated shell home (no named permission) — 登录即可的壳首页
  - id: nav.home
    kind: menu
    href: /pages/index/index
  - id: nav.login
    kind: menu
    href: /pages/login/login
  # Profile (login-only; display name and authenticators)
  # 我的资料（登录即可；称呼与登录方式）
  - id: nav.profile
    kind: menu
    href: /pages/profile/profile
  # Inbox (login-only; end-user inbox API, not operator inbox.read)
  # 站内信（登录即可；走终端站内信接口，不要求操作员 inbox.read）
  - id: nav.inbox
    kind: menu
    href: /pages/inbox/inbox
  # Q7 questionnaire hub (login-only shell entry; anon fill via deep link)
  # Q7 问卷入口（登录即可；匿名填写走深链）
  - id: nav.questionnaires
    kind: menu
    href: /pages/questionnaire/list
  # Own files (login-only; list / upload / signed download)
  # 我的文件（登录即可；列表、上传、签名下载）
  - id: nav.files
    kind: menu
    href: /pages/files/files
  # Purpose-consent records (login-only; end user grants/withdraws their own)
  # 目的同意记录（登录即可；终端用户本人同意或撤回）
  - id: nav.consents
    kind: menu
    href: /pages/consent/consent
  # Own personal-data export requests (login-only; no self-approval controls)
  # 本人资料导出申请（登录即可；页面不提供自行批准）
  - id: nav.exports
    kind: menu
    href: /pages/export/export
  # Own payments (login-only; list/status/cancel PENDING; no create or charge)
  # 本人支付单（登录即可；列表、状态、取消待支付；不能创单或扣费）
  - id: nav.payments
    kind: menu
    href: /pages/payment/payment
  # Placeholder actions — 壳页占位动作
  - id: btn.shell.reprobe
    kind: button
    permission: page.read
  - id: btn.shell.wxLoginStub
    kind: button
    permission: page.read
  - id: page.questionnaires.fill
    kind: page
    route: /pages/questionnaire/fill
  - id: btn.questionnaires.submit
    kind: button
    permission: page.read
