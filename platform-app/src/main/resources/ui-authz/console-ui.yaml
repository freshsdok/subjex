# Console UI permission Manifest (ADR 0010 / PC-1)
# Baseline nav bindings migrated from web/.../console-sections.ts.
# permission / anyOf must be OperatorPermission catalog names; invent → load fail.
# 控制台 UI 权限 Manifest：侧栏绑定自 console-sections 迁入；权限只选自目录。
version: 1
client: console
defaults:
  lockedMenuEffect: grey
  missingButtonEffect: disable
entries:
  # Login-only (no permission / anyOf) — 登录即可
  - id: nav.overview
    kind: menu
    href: /
  - id: nav.services
    kind: menu
    href: /services
    permission: registry.read
  - id: nav.config
    kind: menu
    href: /config
    permission: config.read
  - id: nav.flags
    kind: menu
    href: /flags
    permission: config.read
  - id: nav.inbox
    kind: menu
    href: /inbox
    permission: inbox.read
  - id: nav.inbox.compose
    kind: menu
    href: /inbox/compose
    permission: inbox.send.system
    anyOf:
      - inbox.send.system
      - inbox.broadcast
  - id: nav.inbox.groups
    kind: menu
    href: /inbox/groups
    permission: inbox.group.admin
  - id: nav.audit
    kind: menu
    href: /audit
    permission: admin.read
  - id: nav.dead-letters
    kind: menu
    href: /dead-letters
    permission: admin.read
  - id: nav.deploy
    kind: menu
    href: /deploy
    permission: page.read
  - id: nav.forms
    kind: menu
    href: /forms
    permission: page.read
  - id: nav.pages
    kind: menu
    href: /pages
    permission: page.read
  - id: nav.search
    kind: menu
    href: /search
    permission: page.read
  - id: nav.declarations
    kind: menu
    href: /declarations
    permission: declaration.read
  - id: nav.codegen
    kind: menu
    href: /codegen
    permission: page.read
  - id: nav.operators
    kind: menu
    href: /operators
  - id: nav.tenants
    kind: menu
    href: /tenants
    permission: admin.read
  - id: nav.org
    kind: menu
    href: /org
    permission: org.read
  - id: nav.capabilities
    kind: menu
    href: /capabilities
    permission: page.read
  - id: nav.ui-authz
    kind: menu
    href: /ui-authz
    permission: declaration.read

  # Buttons (PC-4) — UX disable only; APIs still enforce permissions
  # 按钮：仅前端禁用；后端仍强制校验
  - id: btn.inbox.compose.send
    kind: button
    anyOf:
      - inbox.send.system
      - inbox.broadcast
  - id: btn.org.write
    kind: button
    permission: org.write

  # PC-deepen (#5): high-value write buttons — #5 加深高价值写按钮
  - id: btn.flags.write
    kind: button
    permission: config.write
  - id: btn.ui-authz.write
    kind: button
    permission: declaration.write
  - id: btn.ui-authz.promote
    kind: button
    permission: declaration.promote
  - id: btn.declarations.write
    kind: button
    permission: declaration.write
  - id: btn.declarations.promote
    kind: button
    permission: declaration.promote
  - id: btn.tenants.manage
    kind: button
    permission: tenant.manage

  # Page gates for ForbiddenNotice (#5) — 页面 Forbidden 门禁
  - id: page.flags
    kind: page
    route: /flags
    permission: config.read
  - id: page.ui-authz
    kind: page
    route: /ui-authz
    permission: declaration.read
  - id: page.declarations
    kind: page
    route: /declarations
    permission: declaration.read
  - id: page.tenants
    kind: page
    route: /tenants
    permission: admin.read

  # PC-deepen-2: more page Forbidden + config write — 加深更多页面门禁与配置写
  - id: btn.config.write
    kind: button
    permission: config.write

  - id: page.org
    kind: page
    route: /org
    permission: org.read
  - id: page.inbox
    kind: page
    route: /inbox
    permission: inbox.read
  - id: page.inbox.compose
    kind: page
    route: /inbox/compose
    anyOf:
      - inbox.send.system
      - inbox.broadcast
  - id: page.inbox.groups
    kind: page
    route: /inbox/groups
    permission: inbox.group.admin
  - id: page.config
    kind: page
    route: /config
    permission: config.read
  - id: page.audit
    kind: page
    route: /audit
    permission: admin.read
  - id: page.dead-letters
    kind: page
    route: /dead-letters
    permission: admin.read

  # PC-deepen-3: remaining console page Forbidden — 余下控制台页 Forbidden
  - id: btn.operators.manage
    kind: button
    permission: operator.manage

  - id: page.services
    kind: page
    route: /services
    permission: registry.read
  - id: page.deploy
    kind: page
    route: /deploy
    permission: page.read
  - id: page.forms
    kind: page
    route: /forms
    permission: page.read
  - id: page.pages
    kind: page
    route: /pages
    permission: page.read
  - id: page.search
    kind: page
    route: /search
    permission: page.read
  - id: page.codegen
    kind: page
    route: /codegen
    permission: page.read
  - id: page.capabilities
    kind: page
    route: /capabilities
    permission: page.read
  - id: page.operators
    kind: page
    route: /operators
    # login-only (matches nav.operators); manage writes use btn.operators.manage
    # 登录即可（与侧栏一致）；管理写走 btn.operators.manage
