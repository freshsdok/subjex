# LOCAL ONLY — default outbox HMAC for laptop compose/quickstart. Override in any shared environment.
# 仅限本地 — 本机编排/快速开始的出箱 HMAC 默认值。任何共享环境请覆盖。
platform:
  delivery:
    hmac-secret: ${OUTBOX_HMAC_SECRET:change-me-outbox-hmac-secret-local!!}
    tls:
      enabled: false
  # LOCAL ONLY — MFA secret encryption key for laptop enroll/verify.
  # 仅限本地 — 本机登记/校验 MFA 的密钥加密口令。
  mfa:
    encryption-key: ${PLATFORM_MFA_ENCRYPTION_KEY:change-me-mfa-encryption-key-local!!!!}
