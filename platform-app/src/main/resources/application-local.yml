# LOCAL ONLY — default outbox HMAC for laptop compose/quickstart. Override in any shared environment.
# 仅限本地 — 本机编排/快速开始的出箱 HMAC 默认值。任何共享环境请覆盖。
platform:
  # Laptop/quickstart: keep HTTP Basic for curl -u; override with PLATFORM_AUTH_HTTP_BASIC_ENABLED=false.
  # 本机/快速开始：保留 HTTP Basic（curl -u）；可用环境变量关掉。
  auth:
    http-basic-enabled: ${PLATFORM_AUTH_HTTP_BASIC_ENABLED:true}
  delivery:
    hmac-secret: ${OUTBOX_HMAC_SECRET:change-me-outbox-hmac-secret-local!!}
    tls:
      enabled: false
  # LOCAL ONLY — MFA stays optional on a laptop; encryption key for enroll/verify.
  # 仅限本地 — 本机不强制 MFA；加密口令仅用于登记/校验。
  mfa:
    required: false
    encryption-key: ${PLATFORM_MFA_ENCRYPTION_KEY:change-me-mfa-encryption-key-local!!!!}
  # LOCAL ONLY laptop escape hatch — first granted task submit may create a missing tenant.
  # 仅限本机逃生：获准的首次任务提交可为缺失租户建行。生产必须保持关闭。
  tenant:
    auto-create-on-submit: true
  # LOCAL ONLY — directory storage for laptop/dev. Not a multi-instance plan.
  # 仅限本机：本地目录存储。不是多实例方案。
  storage:
    type: local
    download:
      # LOCAL ONLY HMAC for app-issued local-disk download URLs. Override in any shared environment.
      # 仅限本机的本地盘下载 HMAC。任何共享环境请覆盖。
      signing-key: ${PLATFORM_STORAGE_DOWNLOAD_SIGNING_KEY:change-me-storage-download-hmac-local!!}
  # LOCAL ONLY seed — never copy these defaults into prod / k8s / non-dev runbooks.
  # 仅限本地的种子口令——不要把这些默认值抄进生产、k8s 或非开发运行手册。
  local-operator:
    name: ${PLATFORM_OPERATOR_NAME:platform-operator}
    password: ${PLATFORM_OPERATOR_PASSWORD:change-me}

  # LOCAL ONLY — memory verification codes may be returned so a laptop can complete phone login.
  # 仅限本机：内存验证码可出现在响应中，便于完成本机手机号登录。切勿抄进生产。
  end-user:
    auth:
      verification-code:
        reveal-in-response: true
        # Laptop/dev no-op sender; forbidden under prod/production.
        # 本机/开发空发送器；生产禁止此值。
        sender: dev
      wechat:
        dev-stub: true

  # LOCAL ONLY — mock channel adapters; no vendor network. Forbidden under prod/production.
  # 仅限本机：模拟通知渠道，不外呼。生产禁止此值。
  notification:
    sms:
      adapter: mock
    email:
      adapter: mock
    wechat-template:
      adapter: mock

