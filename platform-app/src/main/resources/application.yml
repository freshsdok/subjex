# Platform app — 平台应用
# Switch vendor with PLATFORM_CONNECTION_VENDOR=mysql|postgresql and the matching JDBC settings.
# 用 PLATFORM_CONNECTION_VENDOR=mysql|postgresql 切换厂商，并配上对应的 JDBC 设置。
spring:
  servlet:
    multipart:
      # SHARED-3: align with JdbcEntityBlobStore.MAX_BYTES (5 MiB)
      # SHARED-3：与 JdbcEntityBlobStore.MAX_BYTES（5 MiB）对齐
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: platform-app
  datasource:
    url: ${PLATFORM_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/subjex}
    username: ${PLATFORM_JDBC_USERNAME:subjex}
    password: ${PLATFORM_JDBC_PASSWORD:subjex}
    driver-class-name: ${PLATFORM_JDBC_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Boot 4 / Jackson 3: WRITE_DATES_AS_TIMESTAMPS moved to DateTimeFeature (not SerializationFeature).
    # Boot 4 / Jackson 3：日期时间戳开关改到 datatype.datetime。
    datatype:
      datetime:
        write-dates-as-timestamps: false

# JSON API description — JSON 接口说明：只描述 /api/v1，规格本身也要已登录的操作员才能取。
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  paths-to-match: /api/v1/**

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# OBS-2: structured log fields for correlation + OpenTelemetry trace id (MDC).
# OBS-2：关联 id 与 OTel traceId 写入结构化日志（MDC）。
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} correlationId=%X{correlationId:-} traceId=%X{traceId:-} - %msg%n"

platform:
  # Opaque Bearer access + rotating refresh (Slice C). Console uses Bearer.
  # HTTP Basic is off by default; profile `local` turns it on; scripts in shared envs:
  # PLATFORM_AUTH_HTTP_BASIC_ENABLED=true.
  # 不透明 Bearer（切片 C）。HTTP Basic 默认关；`local` 打开；共享环境脚本用环境变量显式打开。
  auth:
    access-token-ttl: PT30M
    refresh-token-ttl: PT8H
    http-basic-enabled: ${PLATFORM_AUTH_HTTP_BASIC_ENABLED:false}
    # Per-login password failure lockout (Lockout-1). Env: PLATFORM_AUTH_LOCKOUT_MAX_FAILURES / _DURATION.
    # 按登录名口令失败锁定。环境变量可覆盖阈值与时长。
    lockout-max-failures: ${PLATFORM_AUTH_LOCKOUT_MAX_FAILURES:5}
    lockout-duration: ${PLATFORM_AUTH_LOCKOUT_DURATION:PT15M}
  # AuthZ-1d: PolicyEngine implementation. cedar (default) | sql. Env PLATFORM_AUTHZ_ENGINE.
  # Cedar FFI required when cedar; set sql on arches without natives. Fail-closed if cedar selected but unavailable.
  # 策略引擎实现。默认 cedar；无原生库的环境设 sql。选 cedar 不可用则启动失败关闭。
  authz:
    engine: ${PLATFORM_AUTHZ_ENGINE:cedar}
  # AI completion (Item 3 DONE). Default stub — no API keys. HTTP mode needs SUBJEX_AI_HTTP_*;
  # live vendor transport still gated (fail-closed). Write-back requires confirm ticket (noop sink).
  # AI 补全（项 3 已完成）。默认 stub。http 需密钥且外呼仍门闩。写回须确认票（默认 noop）。
  # See docs/ai/capability-real-ai-plan.md.
  ai:
    completion:
      mode: ${PLATFORM_AI_COMPLETION_MODE:stub}
      http:
        base-url: ${SUBJEX_AI_HTTP_BASE_URL:}
        api-key: ${SUBJEX_AI_HTTP_API_KEY:}
        model: ${SUBJEX_AI_HTTP_MODEL:}
  # TOTP MFA (Slice D). required=false initially; set encryption-key in every shared environment.
  # TOTP 多因素（切片 D）。默认不强制；共享环境必须配置 encryption-key。
  mfa:
    required: false
    required-for-platform-operator: false
    challenge-ttl: PT5M
    issuer: subjex
    encryption-key: ${PLATFORM_MFA_ENCRYPTION_KEY:}
    # Optional previous key during rotation overlap / 轮换重叠期可选旧密钥
    encryption-key-previous: ${PLATFORM_MFA_ENCRYPTION_KEY_PREVIOUS:}
  # LOCAL ONLY: used only when SPRING_PROFILES_ACTIVE=local seeds the local operator.
  # 仅限本地：只有 SPRING_PROFILES_ACTIVE=local 写入本地操作员时才用。
  # OIDC RP (Slice E). Off by default; deny unlinked IdP users (no auto-provision).
  # OIDC 依赖方（切片 E）。默认关闭；未绑定 IdP 用户拒绝（不自动建号）。
  # SSO skips local TOTP (trust IdP MFA); password path still uses Slice D.
  # SSO 不走本地 TOTP（信任 IdP MFA）；口令登录仍用切片 D。
  oidc:
    enabled: ${PLATFORM_OIDC_ENABLED:false}
    issuer: ${PLATFORM_OIDC_ISSUER:}
    client-id: ${PLATFORM_OIDC_CLIENT_ID:}
    client-secret: ${PLATFORM_OIDC_CLIENT_SECRET:}
    redirect-uri: ${PLATFORM_OIDC_REDIRECT_URI:}
    scopes: openid,profile,email
    login-ttl: PT10M
  # ID-4 WeChat IdP adapter (open-platform QR + mini-program code2session). Link-required.
  # ID-4 微信 IdP 适配器（开放平台扫码 + 小程序 code2session）。须预先绑定。
  idp:
    wechat:
      enabled: ${PLATFORM_IDP_WECHAT_ENABLED:false}
      app-id: ${PLATFORM_IDP_WECHAT_APP_ID:}
      app-secret: ${PLATFORM_IDP_WECHAT_APP_SECRET:}
      # Console Next route: /api/session/idp/wechat/callback (set full public URL).
      # 控制台 Next 回调：/api/session/idp/wechat/callback（填完整公网 URL）。
      redirect-uri: ${PLATFORM_IDP_WECHAT_REDIRECT_URI:}
  local-operator:
    name: ${PLATFORM_OPERATOR_NAME:platform-operator}
    password: ${PLATFORM_OPERATOR_PASSWORD:change-me}
  # One-shot operator bootstrap (OFF by default). Enable only with --platform.operator.bootstrap=true.
  # 一次性操作员开通（默认关闭）。仅用 --platform.operator.bootstrap=true 显式打开。
  operator:
    bootstrap: false
    login: ${PLATFORM_OPERATOR_LOGIN:}
    password: ${PLATFORM_OPERATOR_PASSWORD:}
    role: ${PLATFORM_OPERATOR_ROLE:platform-operator}
    # Break-glass super-admin bootstrap (OFF by default). Never enable in compose/k8s defaults.
    # 破窗超管开通（默认关闭）。切勿在 compose/k8s 默认打开。
    super-admin-bootstrap: false
    super-admin-login: ${PLATFORM_SUPER_ADMIN_LOGIN:}
    super-admin-password: ${PLATFORM_SUPER_ADMIN_PASSWORD:}
  connection:
    vendor: ${PLATFORM_CONNECTION_VENDOR:postgresql}
  discovery:
    self-host: ${PLATFORM_DISCOVERY_HOST:127.0.0.1}
    static:
      platform-app:
        host: ${PLATFORM_APP_HOST:127.0.0.1}
        port: ${PLATFORM_APP_PORT:8080}
  delivery:
    # Single-select transport: socket (demo, default) | kafka (optional module).
    # 传输单选：socket（演示，默认）| kafka（可选模块）。
    transport: ${PLATFORM_DELIVERY_TRANSPORT:socket}
    consumer-host: ${SAMPLE_CONSUMER_HOST:127.0.0.1}
    consumer-port: ${SAMPLE_CONSUMER_PORT:19081}
    # Shared HMAC secret (≥32). Not an operator password. / 共享 HMAC 密钥（≥32），不是操作员口令。
    hmac-secret: ${OUTBOX_HMAC_SECRET:}
    # Optional previous HMAC during rotation overlap / 轮换重叠期可选旧 HMAC
    hmac-secret-previous: ${OUTBOX_HMAC_SECRET_PREVIOUS:}
    # process = per JVM (default); jdbc = shared delivery_circuit_breaker across replicas (Scale-4c)
    # process = 每进程（默认）；jdbc = 多副本共用 delivery_circuit_breaker（Scale-4c）
    circuit-breaker:
      backend: ${PLATFORM_DELIVERY_CIRCUIT_BREAKER_BACKEND:process}
      destination-key: ${PLATFORM_DELIVERY_CIRCUIT_BREAKER_DESTINATION_KEY:outbox}
    breaker-failure-threshold: 3
    # Background relay for PENDING outbox rows / PENDING 出箱行的后台重投
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:2000}
    relay-batch-size: ${OUTBOX_RELAY_BATCH_SIZE:20}
    # TLS required outside local (see SECURITY.md). / 非 local 必须开 TLS（见 SECURITY.md）。
    tls:
      enabled: ${OUTBOX_TLS_ENABLED:false}
      truststore-path: ${OUTBOX_TLS_TRUSTSTORE_PATH:}
      truststore-password: ${OUTBOX_TLS_TRUSTSTORE_PASSWORD:}
    # Laptop/tests only — never in k8s. / 仅本机/测试，勿用于 k8s。
    allow-insecure: ${OUTBOX_ALLOW_INSECURE:false}
    # Optional Kafka adapter (module subjex-outbox-kafka on classpath; transport=kafka).
    # 可选 Kafka 适配器（classpath 含 subjex-outbox-kafka 且 transport=kafka）。
    declaration-version: ${OUTBOX_DECLARATION_VERSION:1}
    kafka:
      bootstrap-servers: ${OUTBOX_KAFKA_BOOTSTRAP_SERVERS:}
      topic: ${OUTBOX_KAFKA_TOPIC:}
      security:
        protocol: ${OUTBOX_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl:
        mechanism: ${OUTBOX_KAFKA_SASL_MECHANISM:}
        jaas-config: ${OUTBOX_KAFKA_SASL_JAAS_CONFIG:}
  tracing:
    # Empty keeps the discarding exporter / 空则继续用丢弃导出器
    otlp-endpoint: ${PLATFORM_OTLP_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:}}
  rate-limit:
    # process = per JVM (default); jdbc = shared rate_limit_window across platform-app replicas (Scale-4b)
    # process = 每进程（默认）；jdbc = 多副本共用 rate_limit_window（Scale-4b）
    backend: ${PLATFORM_RATE_LIMIT_BACKEND:process}
    permits: 60
  # Tenant hard caps (P5). Over → 429 + audit. No billing.
  # 租户硬顶（P5）。超限 → 429 + 审计。不计费。
  tenant-quota:
    daily-submit-limit: ${PLATFORM_TENANT_DAILY_SUBMIT_LIMIT:10000}
    storage-row-limit: ${PLATFORM_TENANT_STORAGE_ROW_LIMIT:100000}
  op:
    # ID-1 thin OIDC OP issuer (discovery / JWT iss).
    # ID-1 轻量 OIDC 签发方（发现文档 / JWT iss）。
    issuer: ${PLATFORM_OP_ISSUER:http://127.0.0.1:8080}
    access-token-ttl: ${PLATFORM_OP_ACCESS_TOKEN_TTL:PT30M}
    id-token-ttl: ${PLATFORM_OP_ID_TOKEN_TTL:PT30M}
    auth-code-ttl: ${PLATFORM_OP_AUTH_CODE_TTL:PT5M}
    console-client-id: ${PLATFORM_OP_CONSOLE_CLIENT_ID:subjex-console}
  storage:
    # local (default) | s3 (SHARED-2 S3-compatible). Alias env: PLATFORM_STORAGE_TYPE.
    # local（默认）| s3（SHARED-2 S3 兼容）。环境变量 PLATFORM_STORAGE_TYPE。
    type: ${PLATFORM_STORAGE_TYPE:local}
    directory: ${PLATFORM_STORAGE_DIRECTORY:object-store}
    s3:
      endpoint: ${PLATFORM_STORAGE_S3_ENDPOINT:}
      region: ${PLATFORM_STORAGE_S3_REGION:us-east-1}
      bucket: ${PLATFORM_STORAGE_S3_BUCKET:}
      access-key: ${PLATFORM_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${PLATFORM_STORAGE_S3_SECRET_KEY:}
      # MinIO and many gateways need path-style — MinIO 等常需 path-style
      path-style-access: ${PLATFORM_STORAGE_S3_PATH_STYLE:true}
    # CHUNK-1: temp dir for resumable chunk sessions (local assemble → ObjectStorage.put)
    # CHUNK-1：分片会话临时目录（本地组装后 ObjectStorage.put）
    chunk-upload-directory: ${PLATFORM_STORAGE_CHUNK_UPLOAD_DIRECTORY:object-store-chunks}
  # Internal (in-platform) git working tree for declaration promote (Z5). Non-bare; local commit only — not GitHub.
  # 声明晋升用的平台内 git 工作树（Z5）。非裸库；仅本地提交——不依赖 GitHub。
  declaration:
    git:
      dir: ${DECLARATION_GIT_DIR:./data/declaration-git}

management:
  # Separate management port: prometheus not on the business port (P2).
  # 独立管理端口：prometheus 不与业务端口同挂（P2）。
  server:
    port: ${MANAGEMENT_SERVER_PORT:8089}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
