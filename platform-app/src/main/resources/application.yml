# Platform app — 平台应用
# Switch vendor with PLATFORM_CONNECTION_VENDOR=mysql|postgresql and the matching JDBC settings.
# 用 PLATFORM_CONNECTION_VENDOR=mysql|postgresql 切换厂商，并配上对应的 JDBC 设置。
spring:
  application:
    name: platform-app
  datasource:
    url: ${PLATFORM_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/subjex}
    username: ${PLATFORM_JDBC_USERNAME:subjex}
    password: ${PLATFORM_JDBC_PASSWORD:subjex}
    driver-class-name: ${PLATFORM_JDBC_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

# JSON API description — JSON 接口说明：只描述 /api/v1，规格本身也要已登录的操作员才能取。
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  paths-to-match: /api/v1/**

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

platform:
  # Opaque Bearer access + rotating refresh (Slice C). Console uses Bearer.
  # HTTP Basic is off by default; profile `local` turns it on; scripts in shared envs:
  # PLATFORM_AUTH_HTTP_BASIC_ENABLED=true.
  # 不透明 Bearer（切片 C）。HTTP Basic 默认关；`local` 打开；共享环境脚本用环境变量显式打开。
  auth:
    access-token-ttl: PT30M
    refresh-token-ttl: PT8H
    http-basic-enabled: ${PLATFORM_AUTH_HTTP_BASIC_ENABLED:false}
    # Per-login password failure lockout (Lockout-1). Env: PLATFORM_AUTH_LOCKOUT_MAX_FAILURES / _DURATION.
    # 按登录名口令失败锁定。环境变量可覆盖阈值与时长。
    lockout-max-failures: ${PLATFORM_AUTH_LOCKOUT_MAX_FAILURES:5}
    lockout-duration: ${PLATFORM_AUTH_LOCKOUT_DURATION:PT15M}
  # TOTP MFA (Slice D). required=false initially; set encryption-key in every shared environment.
  # TOTP 多因素（切片 D）。默认不强制；共享环境必须配置 encryption-key。
  mfa:
    required: false
    required-for-platform-operator: false
    challenge-ttl: PT5M
    issuer: subjex
    encryption-key: ${PLATFORM_MFA_ENCRYPTION_KEY:}
  # LOCAL ONLY: used only when SPRING_PROFILES_ACTIVE=local seeds the local operator.
  # 仅限本地：只有 SPRING_PROFILES_ACTIVE=local 写入本地操作员时才用。
  # OIDC RP (Slice E). Off by default; deny unlinked IdP users (no auto-provision).
  # OIDC 依赖方（切片 E）。默认关闭；未绑定 IdP 用户拒绝（不自动建号）。
  # SSO skips local TOTP (trust IdP MFA); password path still uses Slice D.
  # SSO 不走本地 TOTP（信任 IdP MFA）；口令登录仍用切片 D。
  oidc:
    enabled: ${PLATFORM_OIDC_ENABLED:false}
    issuer: ${PLATFORM_OIDC_ISSUER:}
    client-id: ${PLATFORM_OIDC_CLIENT_ID:}
    client-secret: ${PLATFORM_OIDC_CLIENT_SECRET:}
    redirect-uri: ${PLATFORM_OIDC_REDIRECT_URI:}
    scopes: openid,profile,email
    login-ttl: PT10M
  local-operator:
    name: ${PLATFORM_OPERATOR_NAME:platform-operator}
    password: ${PLATFORM_OPERATOR_PASSWORD:change-me}
  # One-shot operator bootstrap (OFF by default). Enable only with --platform.operator.bootstrap=true.
  # 一次性操作员开通（默认关闭）。仅用 --platform.operator.bootstrap=true 显式打开。
  operator:
    bootstrap: false
    login: ${PLATFORM_OPERATOR_LOGIN:}
    password: ${PLATFORM_OPERATOR_PASSWORD:}
    role: ${PLATFORM_OPERATOR_ROLE:platform-operator}
    # Break-glass super-admin bootstrap (OFF by default). Never enable in compose/k8s defaults.
    # 破窗超管开通（默认关闭）。切勿在 compose/k8s 默认打开。
    super-admin-bootstrap: false
    super-admin-login: ${PLATFORM_SUPER_ADMIN_LOGIN:}
    super-admin-password: ${PLATFORM_SUPER_ADMIN_PASSWORD:}
  connection:
    vendor: ${PLATFORM_CONNECTION_VENDOR:postgresql}
  discovery:
    self-host: ${PLATFORM_DISCOVERY_HOST:127.0.0.1}
    static:
      platform-app:
        host: ${PLATFORM_APP_HOST:127.0.0.1}
        port: ${PLATFORM_APP_PORT:8080}
  delivery:
    # Single-select transport: socket (demo, default) | kafka (optional module).
    # 传输单选：socket（演示，默认）| kafka（可选模块）。
    transport: ${PLATFORM_DELIVERY_TRANSPORT:socket}
    consumer-host: ${SAMPLE_CONSUMER_HOST:127.0.0.1}
    consumer-port: ${SAMPLE_CONSUMER_PORT:19081}
    # Shared HMAC secret (≥32). Not an operator password. / 共享 HMAC 密钥（≥32），不是操作员口令。
    hmac-secret: ${OUTBOX_HMAC_SECRET:}
    breaker-failure-threshold: 3
    # Background relay for PENDING outbox rows / PENDING 出箱行的后台重投
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:2000}
    relay-batch-size: ${OUTBOX_RELAY_BATCH_SIZE:20}
    # TLS required outside local (see SECURITY.md). / 非 local 必须开 TLS（见 SECURITY.md）。
    tls:
      enabled: ${OUTBOX_TLS_ENABLED:false}
      truststore-path: ${OUTBOX_TLS_TRUSTSTORE_PATH:}
      truststore-password: ${OUTBOX_TLS_TRUSTSTORE_PASSWORD:}
    # Laptop/tests only — never in k8s. / 仅本机/测试，勿用于 k8s。
    allow-insecure: ${OUTBOX_ALLOW_INSECURE:false}
    # Optional Kafka adapter (module subjex-outbox-kafka on classpath; transport=kafka).
    # 可选 Kafka 适配器（classpath 含 subjex-outbox-kafka 且 transport=kafka）。
    declaration-version: ${OUTBOX_DECLARATION_VERSION:1}
    kafka:
      bootstrap-servers: ${OUTBOX_KAFKA_BOOTSTRAP_SERVERS:}
      topic: ${OUTBOX_KAFKA_TOPIC:}
      security:
        protocol: ${OUTBOX_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl:
        mechanism: ${OUTBOX_KAFKA_SASL_MECHANISM:}
        jaas-config: ${OUTBOX_KAFKA_SASL_JAAS_CONFIG:}
  tracing:
    # Empty keeps the discarding exporter / 空则继续用丢弃导出器
    otlp-endpoint: ${PLATFORM_OTLP_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:}}
  rate-limit:
    permits: 60
  storage:
    directory: ${PLATFORM_STORAGE_DIRECTORY:object-store}
  # Internal (in-platform) git working tree for declaration promote (Z5). Non-bare; local commit only — not GitHub.
  # 声明晋升用的平台内 git 工作树（Z5）。非裸库；仅本地提交——不依赖 GitHub。
  declaration:
    git:
      dir: ${DECLARATION_GIT_DIR:./data/declaration-git}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
