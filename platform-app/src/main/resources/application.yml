# Platform app — 平台应用
# Switch vendor with PLATFORM_CONNECTION_VENDOR=mysql|postgresql and the matching JDBC settings.
# 用 PLATFORM_CONNECTION_VENDOR=mysql|postgresql 切换厂商，并配上对应的 JDBC 设置。
spring:
  application:
    name: platform-app
  datasource:
    url: ${PLATFORM_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/subjex}
    username: ${PLATFORM_JDBC_USERNAME:subjex}
    password: ${PLATFORM_JDBC_PASSWORD:subjex}
    driver-class-name: ${PLATFORM_JDBC_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: ${PLATFORM_OPERATOR_NAME:platform-operator}
      password: ${PLATFORM_OPERATOR_PASSWORD:change-me}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

platform:
  connection:
    vendor: ${PLATFORM_CONNECTION_VENDOR:postgresql}
  delivery:
    consumer-base-url: ${SAMPLE_CONSUMER_URL:http://127.0.0.1:8081}
    consumer-username: ${PLATFORM_OPERATOR_NAME:platform-operator}
    consumer-password: ${PLATFORM_OPERATOR_PASSWORD:change-me}
    breaker-failure-threshold: 3
  rate-limit:
    permits: 60
  storage:
    directory: ${PLATFORM_STORAGE_DIRECTORY:object-store}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
