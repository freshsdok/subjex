# Service note flow — 服务备注流程
# Closes entity → page → form: list/detail read the /notes compatibility shim; submit uses service-note form
# (entity.record.upsert → GenericEntityStore on Flyway V11). Prefer /records for new clients.
# 贯通实体→页面→表单：列表/详情读 /notes 兼容垫片；提交走 service-note 表单（通用 upsert）。
flowKey: service-note
titleEn: Service notes
titleZh: 服务备注
formKey: service-note
entityKey: service-note
version: 1
permission: page.read
tenantScoped: false
list:
  path: /pages/service-note
  apiPath: /api/v1/entities/service-note/notes
  itemsKey: notes
detail:
  path: /pages/service-note/{id}
  apiPath: /api/v1/entities/service-note/notes
  itemsKey: notes
  idField: noteId
submit:
  path: /pages/service-note/new
  apiPath: /api/v1/forms/service-note/submissions
  redirectTo: /pages/service-note
