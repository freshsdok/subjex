# Page-block catalog — 页面积木目录
# First-wave runtime / placeholder blocks for declared flow pages (Z2).
# Not a designer. Backend may expose this later; checked-in for shared ids.
# 首波运行时/占位积木（Z2）。不是设计器。后端后续可暴露；检入共享 id。
#
# Note: "generic form field widgets" (text/integer inputs today; more kinds later)
# are covered by FormFields + existing form render — not separate catalog rows yet.
# 说明：通用窗体字段控件由 FormFields + 现有表单渲染覆盖，暂不单列目录项。
blocks:
  - id: ListTable
    titleEn: List table
    titleZh: 列表表
    summaryEn: Renders declared list rows with a detail link per id.
    summaryZh: 按声明渲染列表行，并为每行提供详情链接。
    status: runtime
  - id: FormFields
    titleEn: Form fields (from entity/form)
    titleZh: 表单字段（来自实体/表单）
    summaryEn: Stub for entity-driven field generation; submit page still uses form YAML fields.
    summaryZh: 实体驱动字段生成桩；提交页暂仍用表单 YAML 字段。
    status: placeholder
  - id: DetailReadonly
    titleEn: Detail (read-only)
    titleZh: 只读详情
    summaryEn: Key/value view of one record.
    summaryZh: 单条记录的键值只读展示。
    status: runtime
  - id: Section
    titleEn: Section
    titleZh: 分区
    summaryEn: Layout wrapper for grouping blocks.
    summaryZh: 分组积木的布局包裹。
    status: placeholder
  - id: Tabs
    titleEn: Tabs
    titleZh: 标签页
    summaryEn: Tabbed layout reserved for multi-panel pages.
    summaryZh: 多面板页的标签布局占位。
    status: placeholder
  - id: SubmitBar
    titleEn: Submit bar
    titleZh: 提交栏
    summaryEn: Action bar for review/confirm/cancel on submit pages.
    summaryZh: 提交页的核对/确认/取消操作栏。
    status: runtime
  - id: UserPicker
    titleEn: User picker
    titleZh: 选人
    summaryEn: Live thin-org memberships when tenantId is set; otherwise enabled subject-id text input.
    summaryZh: 有 tenantId 时拉薄组织成员；否则可编辑主体 id 文本框。
    status: runtime-thin
  - id: OrgPicker
    titleEn: Org unit picker
    titleZh: 选部门
    summaryEn: Live thin-org units when tenantId is set; otherwise enabled text input.
    summaryZh: 有 tenantId 时拉薄组织单元；否则可编辑文本框。
    status: runtime-thin
  - id: FlowSorter
    titleEn: Flow sorter / router
    titleZh: 流程分拣器
    summaryEn: Reserved router stub for branching declared flows.
    summaryZh: 声明式流程分支的分拣/路由占位。
    status: placeholder
