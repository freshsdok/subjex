# Page-block catalog — 页面积木目录
# First-wave runtime / placeholder blocks for declared flow pages (Z2).
# Not a designer. Backend may expose this later; checked-in for shared ids.
# 首波运行时/占位积木（Z2）。不是设计器。后端后续可暴露；检入共享 id。
#
# Note: "generic form field widgets" (text/integer inputs today; more kinds later)
# are covered by FormFields + existing form render — not separate catalog rows yet.
# 说明：通用窗体字段控件由 FormFields + 现有表单渲染覆盖，暂不单列目录项。
blocks:
  - id: ListTable
    titleEn: List table
    titleZh: 列表表
    summaryEn: Renders declared list rows with a detail link per id.
    summaryZh: 按声明渲染列表行，并为每行提供详情链接。
    status: runtime
  - id: FormFields
    titleEn: Form fields (from entity/form)
    titleZh: 表单字段（来自实体/表单）
    summaryEn: Renders form/entity fields (text/number/date/enum/boolean; subjectRef/organizationRef via pickers). Used by declared submit.
    summaryZh: 按表单/实体字段渲染控件（文本/数字/日期/枚举/布尔；subjectRef/organizationRef 走选人/选部门）。声明式提交页使用。
    status: runtime
  - id: DetailReadonly
    titleEn: Detail (read-only)
    titleZh: 只读详情
    summaryEn: Key/value view of one record.
    summaryZh: 单条记录的键值只读展示。
    status: runtime
  - id: Section
    titleEn: Section
    titleZh: 分区
    summaryEn: Card-style layout wrapper for grouping blocks; optional title/hint.
    summaryZh: 卡片式分区包裹；可选标题与提示。
    status: runtime
  - id: Tabs
    titleEn: Tabs
    titleZh: 标签页
    summaryEn: Client tablist; detail can show Fields/Raw when detail.blocks includes Tabs.
    summaryZh: 客户端标签栏；detail.blocks 含 Tabs 时可展示字段/原始 JSON。
    status: runtime
  - id: SubmitBar
    titleEn: Submit bar
    titleZh: 提交栏
    summaryEn: Action bar for review/confirm/cancel on submit pages.
    summaryZh: 提交页的核对/确认/取消操作栏。
    status: runtime
  - id: SubjectPicker
    titleEn: Subject picker
    titleZh: 选主体
    summaryEn: Live Membership subjectIds for tenant when tenantId is set; otherwise enabled subject-id text input. Context may narrow candidates.
    summaryZh: 有 tenantId 时拉该租户 Membership 的 subjectId；否则可编辑主体 id。Context 可收窄候选。
    status: runtime-thin
  - id: OrganizationPicker
    titleEn: Organization picker
    titleZh: 选组织
    summaryEn: Live Organizations linked to tenant when tenantId is set; otherwise enabled organization-id text input. Context may narrow candidates.
    summaryZh: 有 tenantId 时拉租户关联 Organization；否则可编辑组织 id。Context 可收窄候选。
    status: runtime-thin
  - id: FlowSorter
    titleEn: Flow sorter / router
    titleZh: 流程分拣器
    summaryEn: Navigation chip row for declared list/new (and concrete detail) paths; show when list.blocks includes FlowSorter.
    summaryZh: 声明式列表/新建（及具体详情）路径的导航芯片行；list.blocks 含 FlowSorter 时显示。
    status: runtime
