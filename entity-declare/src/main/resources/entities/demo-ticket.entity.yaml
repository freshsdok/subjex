# Demo ticket entity — 演示工单实体（Z1 通用引擎样例）
# Hybrid B sample (ADR 0002 / HY-1); does not replace service-note.
# 混合 B 样例（ADR 0002 / HY-1）；不替换 service-note。
# O8-5: subjectRef / organizationRef only.
entityKey: demo-ticket
tableName: demo_ticket
version: 1
permission: page.read
tenantScoped: false
storageMode: hybrid
fields:
  - name: ticketId
    kind: text
    required: true
    maxLength: 64
  - name: title
    kind: text
    required: true
    maxLength: 200
  - name: status
    kind: text
    required: true
    maxLength: 32
  - name: assignee
    kind: subjectRef
    required: false
    maxLength: 64
  - name: organization
    kind: organizationRef
    required: false
    maxLength: 64
