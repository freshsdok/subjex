# Service note entity — 服务备注实体
# Checked-in declaration. Hybrid B sample (ADR 0002 / HY-1); optional table track via storageMode: table.
# 检入声明。混合 B 样例（ADR 0002 / HY-1）；物理表轨须显式 storageMode: table。
entityKey: service-note
tableName: service_note
version: 1
permission: page.read
tenantScoped: false
storageMode: hybrid
fields:
  - name: noteId
    kind: text
    required: true
    maxLength: 64
  - name: title
    kind: text
    required: true
    maxLength: 200
  - name: body
    kind: text
    required: false
    maxLength: 4000
  - name: priority
    kind: integer
    required: false
