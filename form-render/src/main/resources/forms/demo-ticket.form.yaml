# Demo ticket form — 演示工单表单
# Fields align with entities/demo-ticket.entity.yaml. Generic upsert via entity.record.upsert.
# 字段与实体声明对齐。经 entity.record.upsert 通用写入。
# O6: subjectRef / organizationRef (legacy userRef/orgRef still parse).
formKey: demo-ticket
titleEn: Demo ticket
titleZh: 演示工单
version: 1
permission: page.read
tenantScoped: false
domainAction: entity.record.upsert
entityKey: demo-ticket
fields:
  - name: ticketId
    kind: text
    required: true
    maxLength: 64
  - name: title
    kind: text
    required: true
    maxLength: 200
  - name: status
    kind: text
    required: true
    maxLength: 32
  - name: assignee
    kind: subjectRef
    required: false
    maxLength: 64
  - name: orgUnit
    kind: organizationRef
    required: false
    maxLength: 64
effects:
  - key: audit.write
    params:
      actionName: entity.record.upsert
      actionTargetField: ticketId
