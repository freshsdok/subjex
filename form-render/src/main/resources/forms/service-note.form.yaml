# Service note form — 服务备注表单
# Fields align with entities/service-note.entity.yaml. Domain action writes the entity stub store.
# 字段与实体声明对齐。领域动作写入实体桩存储（步骤 3 前非 Flyway）。
formKey: service-note
titleEn: Service note
titleZh: 服务备注
version: 1
permission: page.read
tenantScoped: false
domainAction: entity.serviceNote.save
fields:
  - name: noteId
    kind: text
    required: true
    maxLength: 64
  - name: title
    kind: text
    required: true
    maxLength: 200
  - name: body
    kind: text
    required: false
    maxLength: 4000
  - name: priority
    kind: integer
    required: false
    minimum: 0
    maximum: 100
effects:
  - key: audit.write
    params:
      actionName: entity.serviceNote.save
      actionTargetField: noteId
