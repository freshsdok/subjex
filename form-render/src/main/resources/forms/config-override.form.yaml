# Config override form — 配置覆盖表单
# One declarative form. Not a designer.
# 一份声明式表单。不是设计器。
formKey: config-override
titleEn: Config override
titleZh: 配置覆盖
version: 1
permission: config.write
tenantScoped: false
fields:
  - name: configKey
    kind: text
    required: true
    maxLength: 256
  - name: configValue
    kind: text
    required: true
    maxLength: 4000
effects:
  - key: audit.write
    params:
      actionName: config.override
      actionTargetField: configKey
  - key: extension.invoke
    params:
      extensionName: task-delivery
