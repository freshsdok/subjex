# Repair ticket form — 报修单表单（WF-RT-1）
# Fields align with entities/repair-ticket.entity.yaml. Generic upsert via entity.record.upsert.
# 字段与实体声明对齐。经 entity.record.upsert 通用写入。
# Auto-start workflow is WF-RT-2 (not this form effect) — 自动起实例属 WF-RT-2，非本表单副作用。
formKey: repair-ticket
titleEn: Repair ticket
titleZh: 报修单
version: 1
permission: page.read
tenantScoped: true
domainAction: entity.record.upsert
entityKey: repair-ticket
fields:
  - name: ticketId
    kind: text
    required: true
    maxLength: 64
  - name: title
    kind: text
    required: true
    maxLength: 200
  - name: location
    kind: text
    required: true
    maxLength: 200
  - name: urgency
    kind: enum
    required: true
    maxLength: 32
    enumValues: [low, medium, high, critical]
  - name: assignee
    kind: subjectRef
    required: false
    maxLength: 64
  - name: organization
    kind: organizationRef
    required: false
    maxLength: 64
effects:
  - key: audit.write
    params:
      actionName: entity.record.upsert
      actionTargetField: ticketId
