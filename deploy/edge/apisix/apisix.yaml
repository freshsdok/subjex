# Subjex public edge (APISIX declarative / standalone) — same responsibilities as the Nginx recipe.
# Subjex 对公边缘（APISIX 声明式 / standalone）：职责与 Nginx 配方相同。
# Placeholders for domains and certificates (PLACEHOLDER_* PEM tokens only). Not a live inventory.
# 域与证书均为占位（PEM 里只有 PLACEHOLDER_* 标记）。不是现网清单。
# REPLACE-ME before use: hostnames, PEM blocks, upstreams, trusted hop CIDR.
# 使用前必换：主机名、PEM 块、上游、前一跳可信 CIDR。
# Never commit a real certificate or private key to this repository.
# 切勿把真实证书或私钥提交进本仓库。
# Do not publish management ports 8089/8090/8091. Do not grow entry-gateway into this role.
# 不要发布管理端口。不要把 entry-gateway 做成这一角色。
# This machine is not a production cluster; checking this file in is not a live TLS landing.
# 本机不是生产集群；写入仓库不等于已在真实环境落地 TLS。
#
# Load with APISIX standalone config_provider, or adapt into etcd/Admin API routes.
# 用 APISIX standalone 加载，或改写为 etcd / Admin API 路由。
# Listen on 80 + 443 as sketched in config-notes.yaml (Admin API stays off the public interface).
# 按 config-notes.yaml 监听 80 与 443（Admin API 不对公开放）。

routes:
  # Block actuator on the public edge (every host) / 对公边缘拦截 actuator（所有主机名）
  - id: block-actuator
    uri: /actuator*
    priority: 20
    plugins:
      request-termination:
        status_code: 404
        body: "not found"
    # No upstream — terminated at the edge / 无上游，在边缘终止

  # OTP request-code: tightest class (5/min/IP) / 验证码申请：最严一档
  - id: auth-otp-request-code
    uri: /api/v1/end-user/auth/phone/request-code
    methods: ["POST"]
    hosts: ["api.example.com"]
    priority: 15
    plugins:
      limit-req:
        rate: 0.083
        burst: 2
        key: remote_addr
        rejected_code: 429
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "https"
    upstream_id: platform-app

  # End-user auth including WeChat / 终端登录（含微信）
  - id: auth-end-user
    uris:
      - /api/v1/end-user/auth/*
    hosts: ["api.example.com"]
    priority: 10
    plugins:
      limit-req:
        rate: 0.5
        burst: 10
        key: remote_addr
        rejected_code: 429
    upstream_id: platform-app

  # Operator auth / 操作员认证
  - id: auth-operator
    uris:
      - /api/v1/auth/*
    hosts: ["api.example.com"]
    priority: 10
    plugins:
      limit-req:
        rate: 0.333
        burst: 5
        key: remote_addr
        rejected_code: 429
    upstream_id: platform-app

  # Uploads: 52MB envelope (50 MiB cap + slack) / 上传：52MB 封装上限
  - id: upload-end-user-objects
    uri: /api/v1/end-user/objects*
    hosts: ["api.example.com"]
    priority: 8
    plugins:
      limit-req:
        rate: 2
        burst: 20
        key: remote_addr
        rejected_code: 429
      client-control:
        max_body_size: 54525952
    upstream_id: platform-app

  - id: upload-entities
    uri: /api/v1/entities/*
    hosts: ["api.example.com"]
    priority: 8
    plugins:
      limit-req:
        rate: 2
        burst: 20
        key: remote_addr
        rejected_code: 429
      client-control:
        max_body_size: 54525952
    upstream_id: platform-app

  # General API / 通用 API
  - id: api-general
    uri: /api/v1/*
    hosts: ["api.example.com"]
    priority: 1
    plugins:
      limit-req:
        rate: 2
        burst: 40
        key: remote_addr
        rejected_code: 429
    upstream_id: platform-app

  # Optional operator console hostname / 可选操作员控制台主机名
  - id: operator-console
    uri: /*
    hosts: ["console.example.com"]
    priority: 1
    plugins:
      limit-req:
        rate: 2
        burst: 40
        key: remote_addr
        rejected_code: 429
    upstream_id: console-web

upstreams:
  - id: platform-app
    type: roundrobin
    nodes:
      # Business port only — never 8089/8090/8091 / 仅业务口，绝不用管理口
      "platform-app:8080": 1
  - id: console-web
    type: roundrobin
    nodes:
      # REPLACE-ME with the real static/console upstream / 使用前换成真实控制台上游
      "console-web:80": 1

ssl:
  - id: api-example
    # REPLACE-ME certificate placeholders — replace the PLACEHOLDER_* tokens before use.
    # Never paste a real PEM into this file and commit it.
    # 证书占位：使用前替换 PLACEHOLDER_* 标记。切勿把真实 PEM 粘进本文件并提交。
    snis: ["api.example.com"]
    cert: |-
      -----BEGIN CERTIFICATE-----
      PLACEHOLDER_API_CERT
      -----END CERTIFICATE-----
    key: |-
      -----BEGIN PRIVATE KEY-----
      PLACEHOLDER_API_KEY
      -----END PRIVATE KEY-----
  - id: console-example
    snis: ["console.example.com"]
    cert: |-
      -----BEGIN CERTIFICATE-----
      PLACEHOLDER_CONSOLE_CERT
      -----END CERTIFICATE-----
    key: |-
      -----BEGIN PRIVATE KEY-----
      PLACEHOLDER_CONSOLE_KEY
      -----END PRIVATE KEY-----

# Global plugins: HTTP→HTTPS, HSTS, forwarded headers, trace propagation.
# 全局插件：HTTP 跳转 HTTPS、HSTS、转发头、跟踪头透传。
# `redirect.http_to_https` fires on HTTP only; HTTPS requests continue to the routes above.
# 该跳转只在 HTTP 上触发；HTTPS 仍走上面的路由。
# APISIX must also listen on port 80 (see config-notes.yaml). If port 80 is on a front load
# balancer instead, keep the same 301 to HTTPS there.
# APISIX 还须监听 80（见 config-notes.yaml）。若 80 在前置负载均衡上，也在那里做同样的 301。
global_rules:
  - id: edge-headers
    plugins:
      redirect:
        http_to_https: true
        ret_code: 301
      response-rewrite:
        headers:
          set:
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "https"
          pass:
            - X-Real-IP
            - X-Forwarded-For
            - X-Forwarded-Host
            - X-Correlation-Id
            - X-Request-Id
            - traceparent
            - tracestate
# real-ip plugin: honor X-Forwarded-For only from a trusted hop in front of this edge (placeholder CIDR).
# real-ip 插件：仅从边缘前一跳可信 CIDR 采信 X-Forwarded-For。
#   real-ip:
#     source: "X-Forwarded-For"
#     trusted_addresses: ["10.0.0.0/8"]
