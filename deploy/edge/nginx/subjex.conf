# Subjex public edge (Nginx) — TLS, HSTS, route-class rate limits, upload cap, real-IP, actuator block.
# Subjex 对公边缘（Nginx）：终结 TLS、HSTS、按路由分级限流、上传体积、真实 IP、拦截 actuator。
# Placeholders: api.example.com / console.example.com and certificate paths. Not a live inventory.
# 域与证书均为占位，不是现网清单。
# Do not publish management ports 8089/8090/8091 here. Do not grow entry-gateway into this role.
# 不要在此发布管理端口。不要把 entry-gateway 做成这一角色。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # include mime.types;  # add when installing on a distro / 发行版安装时可打开
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Real IP: if a trusted hop (CDN/LB) sits in front, list its CIDR. Otherwise the edge is the first hop.
    # 真实 IP：若前面还有可信跳（CDN/LB），填其 CIDR；否则本边缘即第一跳。
    set_real_ip_from  127.0.0.1;
    # Replace with the CIDR of a trusted hop in front of this edge (CDN/LB), or remove.
    # 换成边缘前一跳可信 CIDR（CDN/LB），若本机即第一跳可删此行。
    # set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Route-class limits (requests / second; burst in location). Defaults from ADR 0021, changeable.
    # 路由分级限流（每秒；location 里设 burst）。默认见 ADR 0021，可改。
    # 20/min ≈ 0.33/s, 30/min = 0.5/s, 5/min ≈ 0.08/s, 120/min = 2/s.
    limit_req_zone $binary_remote_addr zone=auth_operator:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=auth_end_user:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_otp:10m     rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=120r/m;

    # Default body is small; upload locations raise this to the 52MB envelope (50 MiB file cap + slack).
    # 默认体积较小；上传 location 提到 52MB（50 MiB 文件上限 + 封装余量）。
    client_max_body_size 1m;

    # Temp dirs relative to the nginx prefix (writable during `nginx -t -p <prefix>`).
    # Distro packages may keep their own paths instead.
    # 临时目录相对前缀，便于 `nginx -t -p <prefix>`；发行版可继续用软件包默认路径。
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    upstream platform_app {
        # In-cluster business port only — never the management port.
        # 只反代集群内业务口，绝不走管理口。
        server platform-app:8080;
    }

    upstream operator_console {
        # Optional operator web/ console. Replace with the real static/console upstream.
        # 可选操作员控制台 web/。请换成真实静态或控制台上游。
        server console-web:80;
    }

    log_format main '$remote_addr $request $status correlation_id=$http_x_correlation_id traceparent=$http_traceparent';
    access_log /var/log/nginx/access.log main;

    # HTTP → HTTPS / 明文跳转到 HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name api.example.com console.example.com;
        return 301 https://$host$request_uri;
    }

    # API host (end-user H5 / mini-program and operator API) / API 主机（终端与操作员 API）
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.example.com;

        # Certificate placeholders — replace before use / 证书占位，使用前替换
        ssl_certificate     /etc/nginx/certs/api.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/api.example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # HSTS (preload is open / 是否 preload 为开放点)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Block actuator on the public edge / 对公边缘拦截 actuator
        location ^~ /actuator {
            deny all;
            return 404;
        }

        # OTP request-code: tightest class / 验证码申请：最严一档
        location = /api/v1/end-user/auth/phone/request-code {
            limit_req zone=auth_otp burst=2 nodelay;
            include /etc/nginx/conf.d/subjex-proxy.inc;
        }

        location ^~ /api/v1/end-user/auth/ {
            limit_req zone=auth_end_user burst=10 nodelay;
            include /etc/nginx/conf.d/subjex-proxy.inc;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=auth_operator burst=5 nodelay;
            include /etc/nginx/conf.d/subjex-proxy.inc;
        }

        # Upload prefixes: 52MB envelope aligned with platform.storage.upload.max-bytes (50 MiB) + slack.
        # 上传前缀：52MB 封装上限，对齐 50 MiB 文件帽 + 余量。
        location ^~ /api/v1/end-user/objects {
            client_max_body_size 52m;
            limit_req zone=api_general burst=20 nodelay;
            include /etc/nginx/conf.d/subjex-proxy.inc;
        }

        location ^~ /api/v1/entities/ {
            client_max_body_size 52m;
            limit_req zone=api_general burst=20 nodelay;
            include /etc/nginx/conf.d/subjex-proxy.inc;
        }

        location / {
            limit_req zone=api_general burst=40 nodelay;
            include /etc/nginx/conf.d/subjex-proxy.inc;
        }
    }

    # Optional split hostname for the operator console / 可选：操作员控制台独立主机名
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name console.example.com;

        ssl_certificate     /etc/nginx/certs/console.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/console.example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ^~ /actuator {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://operator_console;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Correlation-Id  $http_x_correlation_id;
            proxy_set_header X-Request-Id      $http_x_request_id;
            proxy_set_header traceparent       $http_traceparent;
        }
    }
}
