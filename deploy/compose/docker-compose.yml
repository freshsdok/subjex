# Local stack: PostgreSQL + Redis + one platform-app + sample-consumer + entry-gateway (P4/Scale-4d default).
# 本地编排：PostgreSQL + Redis + 单 platform-app + sample-consumer + 入口网关（P4/Scale-4d 默认）。
# From repository root:
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Dual replica (`--scale platform-app=2`) is honest only with BOTH backends jdbc
# (PLATFORM_RATE_LIMIT_BACKEND + PLATFORM_DELIVERY_CIRCUIT_BREAKER_BACKEND); defaults stay process.
# See docs/release/single-replica-gate.md. Object store is still per-container disk unless shared.
# 双副本仅在两个后端都为 jdbc 时方可对外宣称；默认仍 process。见单副本门禁文档。对象存储仍按容器本地盘。
# Gateway listens on http://127.0.0.1:8088.
# 网关监听 http://127.0.0.1:8088。
# Outbox delivery uses SAMPLE_CONSUMER_HOST/PORT (same as deploy/k8s/platform-app.yaml).
# 出箱投递用 SAMPLE_CONSUMER_HOST/PORT（与 deploy/k8s/platform-app.yaml 一致）。
# web/ is not in this stack. Images are built here; mvn test does not build them.
# 本栈不含 web/。镜像在这里构建；mvn test 不构建它们。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subjex
      POSTGRES_USER: subjex
      POSTGRES_PASSWORD: subjex
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subjex -d subjex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-app:
    build:
      context: ../..
      dockerfile: platform-app/Dockerfile
    image: subjex/platform-app:0.1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      PLATFORM_CONNECTION_VENDOR: postgresql
      PLATFORM_JDBC_URL: jdbc:postgresql://postgres:5432/subjex
      PLATFORM_JDBC_USERNAME: subjex
      PLATFORM_JDBC_PASSWORD: subjex
      PLATFORM_STORAGE_DIRECTORY: /tmp/objects
      PLATFORM_DISCOVERY_HOST: platform-app
      # Same outbox target as deploy/k8s/platform-app.yaml
      # 出箱目标与 deploy/k8s/platform-app.yaml 相同
      SAMPLE_CONSUMER_HOST: sample-consumer
      SAMPLE_CONSUMER_PORT: "19081"
      # LOCAL ONLY default also in application-local.yml / 本地默认亦见 application-local.yml
      OUTBOX_HMAC_SECRET: change-me-outbox-hmac-secret-local!!
      MANAGEMENT_SERVER_PORT: "8089"
      # Optional OTLP collector, e.g. http://otel-collector:4318
      # 可选 OTLP 采集器，例如 http://otel-collector:4318
      PLATFORM_OTLP_ENDPOINT: ${PLATFORM_OTLP_ENDPOINT:-}
    # No host port for business HTTP; management (probes/metrics) stays on the compose network.
    # 业务 HTTP 不映射宿主机；管理口（探针/指标）留在编排网络。
    expose:
      - "8080"
      - "8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  sample-consumer:
    build:
      context: ../..
      dockerfile: sample-consumer/Dockerfile
    image: subjex/sample-consumer:0.1.0-SNAPSHOT
    depends_on:
      platform-app:
        condition: service_healthy
    environment:
      SAMPLE_DELIVERY_PORT: "19081"
      SPRING_PROFILES_ACTIVE: local
      OUTBOX_HMAC_SECRET: change-me-outbox-hmac-secret-local!!
      MANAGEMENT_SERVER_PORT: "8091"
      PLATFORM_APP_HOST: platform-app
      PLATFORM_APP_PORT: "8080"
      PLATFORM_DISCOVERY_HOST: sample-consumer
      PLATFORM_OTLP_ENDPOINT: ${PLATFORM_OTLP_ENDPOINT:-}
    # Delivery TCP + HTTP probes; no host publish (platform-app reaches it on the compose network).
    # 投递 TCP + HTTP 探针；不映射宿主机（platform-app 在编排网络上到达它）。
    expose:
      - "8081"
      - "8091"
      - "19081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  entry-gateway:
    build:
      context: ../..
      dockerfile: entry-gateway/Dockerfile
    image: subjex/entry-gateway:0.1.0-SNAPSHOT
    depends_on:
      platform-app:
        condition: service_healthy
    environment:
      GATEWAY_UPSTREAM: http://platform-app:8080
      GATEWAY_RATE_LIMIT_PERMITS: "120"
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: "60"
      # Empty = ignore X-Forwarded-For; set to the proxy IPs/CIDRs in front of the gateway.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      MANAGEMENT_SERVER_PORT: "8090"
      PLATFORM_OTLP_ENDPOINT: ${PLATFORM_OTLP_ENDPOINT:-}
    ports:
      - "8088:8088"
