# Local stack: PostgreSQL + Redis + two platform-app replicas + sample-consumer + entry-gateway
# 本地编排：PostgreSQL + Redis + 两个 platform-app 副本 + sample-consumer + 入口网关
# From repository root:
#   docker compose -f deploy/compose/docker-compose.yml up --build --scale platform-app=2
# Gateway listens on http://127.0.0.1:8088 and DNS-round-robins to platform-app.
# 网关监听 http://127.0.0.1:8088，经 Compose DNS 轮询 platform-app。
# Outbox delivery uses SAMPLE_CONSUMER_HOST/PORT (same as deploy/k8s/platform-app.yaml).
# 出箱投递用 SAMPLE_CONSUMER_HOST/PORT（与 deploy/k8s/platform-app.yaml 一致）。
# web/ is not in this stack. Images are built here; mvn test does not build them.
# 本栈不含 web/。镜像在这里构建；mvn test 不构建它们。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subjex
      POSTGRES_USER: subjex
      POSTGRES_PASSWORD: subjex
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subjex -d subjex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-app:
    build:
      context: ../..
      dockerfile: platform-app/Dockerfile
    image: subjex/platform-app:0.1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      PLATFORM_CONNECTION_VENDOR: postgresql
      PLATFORM_JDBC_URL: jdbc:postgresql://postgres:5432/subjex
      PLATFORM_JDBC_USERNAME: subjex
      PLATFORM_JDBC_PASSWORD: subjex
      PLATFORM_STORAGE_DIRECTORY: /tmp/objects
      PLATFORM_DISCOVERY_HOST: platform-app
      # Same outbox target as deploy/k8s/platform-app.yaml
      # 出箱目标与 deploy/k8s/platform-app.yaml 相同
      SAMPLE_CONSUMER_HOST: sample-consumer
      SAMPLE_CONSUMER_PORT: "19081"
      # Optional OTLP collector, e.g. http://otel-collector:4318
      # 可选 OTLP 采集器，例如 http://otel-collector:4318
      PLATFORM_OTLP_ENDPOINT: ${PLATFORM_OTLP_ENDPOINT:-}
    # No host port: scaling to 2 would conflict on 8080. Reach the app via the gateway.
    # 不映射宿主机端口：扩到 2 会抢 8080。经网关访问。
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  sample-consumer:
    build:
      context: ../..
      dockerfile: sample-consumer/Dockerfile
    image: subjex/sample-consumer:0.1.0-SNAPSHOT
    depends_on:
      platform-app:
        condition: service_healthy
    environment:
      SAMPLE_DELIVERY_PORT: "19081"
      PLATFORM_APP_HOST: platform-app
      PLATFORM_APP_PORT: "8080"
      PLATFORM_DISCOVERY_HOST: sample-consumer
      PLATFORM_OTLP_ENDPOINT: ${PLATFORM_OTLP_ENDPOINT:-}
    # Delivery TCP + HTTP probes; no host publish (platform-app reaches it on the compose network).
    # 投递 TCP + HTTP 探针；不映射宿主机（platform-app 在编排网络上到达它）。
    expose:
      - "8081"
      - "19081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  entry-gateway:
    build:
      context: ../..
      dockerfile: entry-gateway/Dockerfile
    image: subjex/entry-gateway:0.1.0-SNAPSHOT
    depends_on:
      platform-app:
        condition: service_healthy
    environment:
      GATEWAY_UPSTREAM: http://platform-app:8080
      GATEWAY_RATE_LIMIT_PERMITS: "120"
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: "60"
      # Empty = ignore X-Forwarded-For; set to the proxy IPs/CIDRs in front of the gateway.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      PLATFORM_OTLP_ENDPOINT: ${PLATFORM_OTLP_ENDPOINT:-}
    ports:
      - "8088:8088"
