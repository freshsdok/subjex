# Not applied by the build or the tests. No cluster.
# The image is built from platform-app/Dockerfile; mvn test does not build it.
# 构建和测试不会应用这份清单。没有集群。镜像由 platform-app/Dockerfile 构建，mvn test 不构建它。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-app
  labels:
    app: platform-app
spec:
  # P4/Scale-4d: default remains replicas: 1. Advertise N>1 only with BOTH
  # PLATFORM_RATE_LIMIT_BACKEND=jdbc AND PLATFORM_DELIVERY_CIRCUIT_BREAKER_BACKEND=jdbc
  # (see docs/release/single-replica-gate.md and platform-app-shared-backends.snippet.yaml).
  # WP1-4: production object storage is S3-compatible (env/Secret below). Local disk is not the plan.
  # P4/Scale-4d：默认仍 replicas: 1。对外 N>1 须两个后端都为 jdbc（见单副本门禁文档与可选片段）。
  # WP1-4：生产对象存储为 S3 兼容（下方环境变量/Secret）。本地盘不是生产方案。
  replicas: 1
  selector:
    matchLabels:
      app: platform-app
  template:
    metadata:
      labels:
        app: platform-app
    spec:
      containers:
        - name: platform-app
          image: subjex/platform-app:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          # The Dockerfile runs as uid 10001; Kubernetes refuses root.
          # Dockerfile 以 uid 10001 运行；Kubernetes 拒绝 root。
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8089
          env:
            # Dedicated production profile; never combine with local (ProductionProfileGuard).
            # 专用生产 profile；不可与 local 组合（ProductionProfileGuard）。
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: PLATFORM_CONNECTION_VENDOR
              value: postgresql
            - name: PLATFORM_JDBC_URL
              value: jdbc:postgresql://postgresql:5432/subjex
            - name: PLATFORM_JDBC_USERNAME
              value: subjex
            - name: PLATFORM_JDBC_PASSWORD
              value: subjex
            - name: PLATFORM_DISCOVERY_HOST
              value: platform-app
            - name: SAMPLE_CONSUMER_HOST
              value: sample-consumer
            - name: SAMPLE_CONSUMER_PORT
              value: "19081"
            # Required: ≥32 char shared secret. Enable TLS + mount PKCS12 for non-local.
            # 必填：≥32 字符共享密钥。非 local 需开 TLS 并挂载 PKCS12。
            - name: OUTBOX_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: outbox-delivery
                  key: hmac-secret
            - name: OUTBOX_TLS_ENABLED
              value: "true"
            - name: OUTBOX_TLS_TRUSTSTORE_PATH
              value: /var/run/outbox-tls/trust.p12
            - name: OUTBOX_TLS_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outbox-delivery
                  key: truststore-password
            # Empty keeps discarding exporter / 空则继续丢弃跨度
            - name: MANAGEMENT_SERVER_PORT
              value: "8089"
            - name: PLATFORM_OTLP_ENDPOINT
              value: ""
            # WP1-4: S3-compatible object storage (MinIO or any S3 API). No real credentials here.
            # Prod profile already defaults type=s3; these Secret keys must be provided or startup fails.
            # Do not mount a local object-store volume as the production plan.
            # WP1-4：S3 兼容对象存储（MinIO 等）。此处无真实密钥。
            # prod 已默认 type=s3；须提供下列 Secret，否则启动失败。不要把本地盘当生产方案。
            - name: PLATFORM_STORAGE_TYPE
              value: s3
            - name: PLATFORM_STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: platform-object-storage
                  key: endpoint
            - name: PLATFORM_STORAGE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: platform-object-storage
                  key: region
            - name: PLATFORM_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: platform-object-storage
                  key: bucket
            - name: PLATFORM_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-object-storage
                  key: access-key
            - name: PLATFORM_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-object-storage
                  key: secret-key
            - name: PLATFORM_STORAGE_S3_PATH_STYLE
              value: "true"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: outbox-tls
              mountPath: /var/run/outbox-tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: outbox-tls
          secret:
            secretName: outbox-delivery-tls

---
apiVersion: v1
kind: Service
metadata:
  name: platform-app
  labels:
    app: platform-app
spec:
  selector:
    app: platform-app
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8089
      targetPort: management
