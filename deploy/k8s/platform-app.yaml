# Not applied by the build or the tests. No cluster.
# The image is built from platform-app/Dockerfile; mvn test does not build it.
# 构建和测试不会应用这份清单。没有集群。镜像由 platform-app/Dockerfile 构建，mvn test 不构建它。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-app
  labels:
    app: platform-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-app
  template:
    metadata:
      labels:
        app: platform-app
    spec:
      containers:
        - name: platform-app
          image: subjex/platform-app:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          # The Dockerfile runs as uid 10001; Kubernetes refuses root.
          # Dockerfile 以 uid 10001 运行；Kubernetes 拒绝 root。
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLATFORM_CONNECTION_VENDOR
              value: postgresql
            - name: PLATFORM_JDBC_URL
              value: jdbc:postgresql://postgresql:5432/subjex
            - name: PLATFORM_JDBC_USERNAME
              value: subjex
            - name: PLATFORM_JDBC_PASSWORD
              value: subjex
            - name: PLATFORM_DISCOVERY_HOST
              value: platform-app
            - name: SAMPLE_CONSUMER_HOST
              value: sample-consumer
            - name: SAMPLE_CONSUMER_PORT
              value: "19081"
            # Required: ≥32 char shared secret. Enable TLS + mount PKCS12 for non-local.
            # 必填：≥32 字符共享密钥。非 local 需开 TLS 并挂载 PKCS12。
            - name: OUTBOX_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: outbox-delivery
                  key: hmac-secret
            - name: OUTBOX_TLS_ENABLED
              value: "true"
            - name: OUTBOX_TLS_TRUSTSTORE_PATH
              value: /var/run/outbox-tls/trust.p12
            - name: OUTBOX_TLS_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outbox-delivery
                  key: truststore-password
            # Empty keeps discarding exporter / 空则继续丢弃跨度
            - name: PLATFORM_OTLP_ENDPOINT
              value: ""
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: outbox-tls
              mountPath: /var/run/outbox-tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: outbox-tls
          secret:
            secretName: outbox-delivery-tls

---
apiVersion: v1
kind: Service
metadata:
  name: platform-app
  labels:
    app: platform-app
spec:
  selector:
    app: platform-app
  ports:
    - name: http
      port: 8080
      targetPort: http
