# Not applied by the build or the tests. No cluster.
# The image is built from entry-gateway/Dockerfile; mvn test does not build it.
# 构建和测试不会应用这份清单。没有集群。镜像由 entry-gateway/Dockerfile 构建，mvn test 不构建它。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entry-gateway
  labels:
    app: entry-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entry-gateway
  template:
    metadata:
      labels:
        app: entry-gateway
    spec:
      containers:
        - name: entry-gateway
          image: subjex/entry-gateway:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: GATEWAY_UPSTREAM
              value: http://platform-app:8080
            - name: GATEWAY_RATE_LIMIT_PERMITS
              value: "120"
            - name: GATEWAY_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: entry-gateway
spec:
  selector:
    app: entry-gateway
  ports:
    - name: http
      port: 8088
      targetPort: http
