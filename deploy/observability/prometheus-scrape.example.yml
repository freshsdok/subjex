# Example Prometheus scrape config for Subjex management ports (WP9-2).
# 面向 Subjex 管理端口的 Prometheus 抓取配置样例（WP9-2）。
#
# This is a fragment to merge into an operator-owned Prometheus (or a compatible scraper).
# It is not applied by CI, and checking it in does not deploy Prometheus or Grafana.
# 这是一段给运维自建 Prometheus（或兼容抓取器）合并用的片段。
# CI 不会应用它；写入仓库也不等于已部署 Prometheus 或 Grafana。
#
# Scrape only from inside the cluster or a trusted admin network.
# Never Ingress the management ports, and never expose /actuator on the public edge.
# 只从集群内或受信任的管理网段抓取。管理端口不要走 Ingress，对公边缘不要暴露 /actuator。
#
# Replace the example hosts. Job names match spring.application.name and the Grafana dashboard $job variable.
# 请替换示例主机名。job 名与 spring.application.name 以及 Grafana 看板的 $job 变量一致。

scrape_configs:
  - job_name: platform-app
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - platform-app:8089
  - job_name: entry-gateway
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - entry-gateway:8090
  - job_name: sample-consumer
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - sample-consumer:8091
