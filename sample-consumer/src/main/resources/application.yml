# Sample consumer — 示例消费者
# Second application. It takes TaskRecorded from the outbox socket.
# 第二个应用。它从出箱套接字接收 TaskRecorded。
spring:
  application:
    name: sample-consumer
  security:
    user:
      name: ${PLATFORM_OPERATOR_NAME:platform-operator}
      password: ${PLATFORM_OPERATOR_PASSWORD:change-me}

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

platform:
  tracing:
    otlp-endpoint: ${PLATFORM_OTLP_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:}}
  discovery:
    self-host: ${PLATFORM_DISCOVERY_HOST:127.0.0.1}
    static:
      platform-app:
        host: ${PLATFORM_APP_HOST:127.0.0.1}
        port: ${PLATFORM_APP_PORT:8080}
  delivery:
    listen-port: ${SAMPLE_DELIVERY_PORT:19081}
    hmac-secret: ${OUTBOX_HMAC_SECRET:}
    tls:
      enabled: ${OUTBOX_TLS_ENABLED:false}
      keystore-path: ${OUTBOX_TLS_KEYSTORE_PATH:}
      keystore-password: ${OUTBOX_TLS_KEYSTORE_PASSWORD:}
    allow-insecure: ${OUTBOX_ALLOW_INSECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
